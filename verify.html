<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>KAYZ — Cek Pesanan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>try{var b=localStorage.getItem('kayz_brand');if(b)document.documentElement.setAttribute('data-brand',b)}catch(e){}</script>
</head>
<body>

<header class="top">
  <a class="logo" href="./">kayz<i>.</i></a>
  <div class="top-r">
    <span class="tag">Cek pesanan</span>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Pilih warna" aria-expanded="false"></button>
  </div>
  <div class="theme-pop" id="themePop" role="group" aria-label="Pilih warna"><div class="sw-list" id="swList"></div></div>
</header>

<main class="wrap">
  <section class="hero rise" style="--i:0">
    <h1>Pesanan asli<br><em>atau diubah?</em></h1>
  </section>

  <section class="panel rise" style="--i:1">
    <div class="field" id="rawField">
      <label class="lbl" for="raw">Pesan pembeli</label>
      <textarea id="raw" placeholder="Tempel pesan di sini" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
    </div>

    <button class="cta" id="checkBtn" type="button" style="margin-top:0">
      <span class="cta-a">Cek pesanan</span>
      <span class="cta-b">
        <svg class="chk" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" pathLength="1"/></svg>
        Chat dihapus
      </span>
    </button>

    <div class="res" id="out" aria-live="polite"></div>
  </section>
</main>

<script src="prices.js"></script>
<script src="core.js"></script>
<script src="ui.js"></script>
<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const raw = $('raw');
  const out = $('out');
  const btn = $('checkBtn');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const ICON_OK  = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" pathLength="1"/></svg>';
  const ICON_BAD = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5v7M12 17.5h.01" pathLength="1"/></svg>';

  // label harus ada di AWAL baris (setelah simbol), jadi isi target tidak bisa menyamar sebagai baris lain
  function line(text, label) {
    const re = new RegExp('^[^\\w\\n]*' + label + '\\s*:\\s*(.+?)\\s*$', 'mi');
    const m = text.match(re);
    return m ? m[1] : null;
  }
  function digits(s) { return Number(String(s).replace(/[^\d]/g, '')); }
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  function restart(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  // hapus isi chat dari kolom (dengan animasi singkat)
  function wipeChat() {
    if (!raw.value) return;
    if (reduce) { raw.value = ''; return; }
    raw.classList.add('wipe');
    setTimeout(() => {
      raw.value = '';
      raw.classList.remove('wipe');
    }, 360);
  }

  function resetAll() {
    out.classList.remove('show');
    out.innerHTML = '';
    raw.value = '';
    raw.focus();
  }

  btn.addEventListener('click', () => {
    const text = raw.value;
    const field = $('rawField');

    if (!text.trim()) {
      restart(field, 'invalid');
      raw.focus();
      setTimeout(() => field.classList.remove('invalid'), 900);
      return;
    }

    const platform = line(text, 'platform\\/aplikasi');
    const layanan  = line(text, 'layanan suntik');
    const jumlahS  = line(text, 'jumlah');
    const targetV  = line(text, 'target');
    const totalS   = line(text, 'total harga');
    const kode     = line(text, 'kode');
    const problems = [];

    if (!platform || !layanan || !jumlahS || !targetV || !totalS) {
      problems.push('Format pesan tidak lengkap atau tidak dikenali (kemungkinan diedit manual).');
    }

    let expected = null, claimed = null, qty = null;
    if (platform && layanan && jumlahS && totalS) {
      qty = digits(jumlahS);
      claimed = digits(totalS);
      const label = layanan.replace(/\s*\(.*\)\s*$/, '');
      const svc = findService(platform, label);
      if (!svc) {
        problems.push('Platform/layanan tidak ada di daftar harga.');
      } else {
        expected = calcTotal(svc, qty);
        if (qty < svc.min) problems.push(`Jumlah di bawah minimal (${svc.min}).`);
        if (qty > MAX_QTY) problems.push('Jumlah melebihi batas per pesanan.');
        if (claimed !== expected) problems.push(`Total tidak cocok. Di pesan ${fmtRp(claimed)}, seharusnya ${fmtRp(expected)}.`);
      }
      if (!isHttpsUrl(targetV)) problems.push('Target bukan link https:// yang valid.');
      if (!kode) {
        problems.push('Kode verifikasi tidak ada.');
      } else {
        const want = orderCode({ platform, layanan, qty, total: claimed, target: targetV });
        if (want !== kode) problems.push('Kode verifikasi tidak valid (isi pesan diubah setelah dibuat).');
      }
    }

    const ok = problems.length === 0;

    out.className = 'res ' + (ok ? 'ok' : 'bad');
    out.innerHTML =
      `<div class="res-head"><span class="ico">${ok ? ICON_OK : ICON_BAD}</span><h2>${ok ? 'Pesanan asli' : 'Mencurigakan'}</h2></div>` +
      '<div class="res-body">' +
        (ok
          ? `Total <b>${fmtRp(expected)}</b> sesuai daftar harga.<span class="tgt">${esc(targetV)}</span>`
          : '<ul>' + problems.map(p => `<li>${esc(p)}</li>`).join('') + '</ul>' +
            (expected !== null ? `<div style="margin-top:8px">Harga yang benar: <b>${fmtRp(expected)}</b></div>` : '')) +
      '</div>' +
      '<div class="res-actions">' +
        (ok ? '<button class="btn solid" id="copyBtn" type="button">Salin target</button>' : '') +
        '<button class="btn ghost" id="resetBtn" type="button">Cek lagi</button>' +
      '</div>';
    restart(out, 'show');

    $('resetBtn').addEventListener('click', resetAll);

    if (ok) {
      const copyBtn = $('copyBtn');
      let copyTimer = null;
      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(targetV);
        } catch (err) {
          const ta = document.createElement('textarea');
          ta.value = targetV;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
        }
        copyBtn.textContent = 'Tersalin';
        clearTimeout(copyTimer);
        copyTimer = setTimeout(() => { copyBtn.textContent = 'Salin target'; }, 1500);
      });
    }

    // setelah dicek, semua chat langsung dihapus dari kolom
    wipeChat();
    btn.classList.add('sent');
    setTimeout(() => btn.classList.remove('sent'), 2000);
  });

  // jangan biarkan isi chat tertinggal saat halaman ditutup / pindah tab
  window.addEventListener('pagehide', () => { raw.value = ''; });
})();
</script>
</body>
</html>
